      <ellipse cx="325" cy="211" rx="28" ry="11" transform="rotate(-32 325 211)" fill="#fff" opacity=".68"/>
      <circle cx="350" cy="245" r="76" fill="none" stroke="#eaffff" stroke-opacity=".42" stroke-width="2"/>
      <circle cx="1500" cy="235" r="58" fill="url(#orb)" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
      <ellipse cx="1482" cy="212" rx="20" ry="8" transform="rotate(-28 1482 212)" fill="#fff" opacity=".72"/>
