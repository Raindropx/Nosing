<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1824" height="1024" viewBox="0 0 1824 1024"><desc>纯背景壁纸，Frutiger Aero 风格，16:9 横向，用作软件窗口底图：抽象的青绿与天蓝色柔和渐变，半透明水珠、微妙的玻璃质感光球、少量绿叶和流畅水波从四角向中央延伸，清新自然，中心留出大面积柔和平静的负空间，细节克制。只画无边框的抽象自然图案，绝对不要界面、窗口、面板、矩形框、按钮、图表、图标、文字、水印或标志。整合细碎的细节为更干净的面。</desc>
  <title>Frutiger Aero abstract nature wallpaper</title>
  <desc>Editable vector wallpaper with a calm aqua and sky-blue gradient, translucent water droplets, glass orbs, flowing water and restrained leaves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee9d3"/>
      <stop offset=".42" stop-color="#75d9e7"/>
      <stop offset="1" stop-color="#73bce9"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx=".51" cy=".46" r=".7">
      <stop offset="0" stop-color="#e5fff7" stop-opacity=".84"/>
      <stop offset=".42" stop-color="#d1fff5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d1fff5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#eaffff" stop-opacity=".72"/>
      <stop offset=".45" stop-color="#8ce9e8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#3bafd8" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#baffbf" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#3ebc91" stop-opacity=".64"/>
      <stop offset="1" stop-color="#168b83" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="orb" cx=".28" cy=".2" r=".82">
      <stop stop-color="#ffffff" stop-opacity=".94"/>
      <stop offset=".18" stop-color="#efffff" stop-opacity=".57"/>
      <stop offset=".56" stop-color="#a9f6f0" stop-opacity=".2"/>
      <stop offset=".83" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".32"/>
    </radialGradient>
    <linearGradient id="drop" x1=".15" y1="0" x2=".8" y2="1">
      <stop stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".25" stop-color="#e9ffff" stop-opacity=".5"/>
      <stop offset=".7" stop-color="#8be7ed" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".48"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="tinyBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="canvas"><rect width="1824" height="1024"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
