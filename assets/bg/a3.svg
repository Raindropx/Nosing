    <rect width="1824" height="1024" fill="url(#centerGlow)"/>
    <ellipse cx="240" cy="100" rx="410" ry="260" fill="#d6fff0" opacity=".27" filter="url(#soft)"/>
    <ellipse cx="1650" cy="920" rx="460" ry="300" fill="#b5f7ff" opacity=".28" filter="url(#soft)"/>
    <ellipse cx="920" cy="520" rx="620" ry="390" fill="#effffb" opacity=".19" filter="url(#soft)"/>

