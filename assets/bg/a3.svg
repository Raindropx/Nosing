      <circle cx="260" cy="720" r="42" fill="url(#orb)" stroke="#fff" stroke-opacity=".48" stroke-width="2"/>
      <ellipse cx="247" cy="704" rx="15" ry="6" transform="rotate(-25 247 704)" fill="#fff" opacity=".7"/>
