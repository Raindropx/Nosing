      <ellipse cx="1584" cy="687" rx="26" ry="10" transform="rotate(-28 1584 687)" fill="#fff" opacity=".68"/>
      <circle cx="1610" cy="720" r="68" fill="none" stroke="#eaffff" stroke-opacity=".4" stroke-width="2"/>
    </g>

    <g fill="url(#drop)" stroke="#ffffff" stroke-opacity=".66" stroke-width="2">
      <path d="M190 420 C190 420 153 466 153 490 C153 514 169 530 190 530 C211 530 228 514 228 490 C228 466 190 420 190 420Z"/>
      <path d="M1650 405 C1650 405 1623 439 1623 459 C1623 477 1636 490 1652 490 C1669 490 1681 477 1681 459 C1681 439 1650 405 1650 405Z"/>
      <path d="M1430 820 C1430 820 1411 845 1411 860 C1411 874 1422 884 1435 884 C1448 884 1458 873 1458 860 C1458 845 1430 820 1430 820Z"/>
      <path d="M470 820 C470 820 450 847 450 863 C450 878 461 889 476 889 C491 889 502 878 502 863 C502 847 470 820 470 820Z"/>
    </g>
    <g fill="none" stroke="#fff" stroke-linecap="round">
      <path d="M172 475 Q177 454 190 442" stroke-width="4" stroke-opacity=".85"/>
      <path d="M1637 448 Q1642 433 1651 424" stroke-width="3" stroke-opacity=".8"/>
      <path d="M1422 855 Q1426 844 1432 838" stroke-width="2.5" stroke-opacity=".8"/>
      <path d="M461 858 Q465 845 473 839" stroke-width="2.5" stroke-opacity=".8"/>
    </g>

    <g fill="#fff">
      <circle cx="520" cy="310" r="3" opacity=".65"/>
      <circle cx="1285" cy="300" r="4" opacity=".55"/>
      <circle cx="1370" cy="610" r="3" opacity=".48"/>
      <circle cx="410" cy="640" r="4" opacity=".42"/>
      <circle cx="1740" cy="540" r="3" opacity=".55"/>
      <circle cx="95" cy="580" r="3" opacity=".5"/>
    </g>
    <g stroke="#fff" stroke-linecap="round" stroke-opacity=".48">
      <path d="M520 300 V320 M510 310 H530" stroke-width="2"/>
      <path d="M1285 286 V314 M1271 300 H1299" stroke-width="2"/>
      <path d="M1740 529 V551 M1729 540 H1751" stroke-width="1.7"/>
    </g>
  </g>
</svg>
