      <path d="M1840 285 C1755 265 1685 238 1620 225" fill="none" stroke="#eaffdf" stroke-width="2" stroke-opacity=".5"/>
      <path d="M-35 820 C65 730 155 710 245 738 C175 815 80 855 -35 820Z" fill="url(#leaf)" opacity=".62"/>
      <path d="M-20 817 C65 790 145 760 225 744" fill="none" stroke="#eaffdf" stroke-width="2" stroke-opacity=".48"/>
      <path d="M1855 800 C1750 700 1665 680 1575 715 C1655 800 1750 845 1855 800Z" fill="url(#leaf)" opacity=".68"/>
      <path d="M1840 797 C1745 765 1665 735 1595 720" fill="none" stroke="#eaffdf" stroke-width="3" stroke-opacity=".5"/>
