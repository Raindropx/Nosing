<svg xmlns="http://www.w3.org/2000/svg" width="1824" height="1024" viewBox="0 0 1824 1024"><desc>纯背景壁纸，Frutiger Aero 风格，16:9 横向，用作软件窗口底图：清澈青蓝色水下世界，水面透下的柔和阳光、稀疏透明气泡与流动水波，边缘点缀少量海草，中央保留大面积安静的蓝绿色渐变，柔和低对比。仅绘制自然背景，绝对不要界面、窗口、面板、矩形框、按钮、图表、图标、文字、水印或标志。整合细碎的细节为更干净的面。</desc>
  <title>Frutiger Aero underwater background</title>
  <desc>Clean turquoise underwater wallpaper with soft sun rays, gentle caustics, sparse bubbles and subtle sea grass. Entirely editable vector artwork.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#b8f5ee"/>
      <stop offset="0.25" stop-color="#72d9d4"/>
      <stop offset="0.62" stop-color="#38b9bd"/>
      <stop offset="1" stop-color="#168c9e"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="51%" cy="48%" r="66%">
      <stop offset="0" stop-color="#c8fff1" stop-opacity=".56"/>
      <stop offset=".48" stop-color="#8be9df" stop-opacity=".22"/>
      <stop offset="1" stop-color="#168ba1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#effff9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b6f8ec" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5fff2" stop-opacity=".48"/>
      <stop offset="1" stop-color="#e4fff7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#126d75" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#32a99b" stop-opacity=".72"/>
      <stop offset="1" stop-color="#a5efcf" stop-opacity=".52"/>
    </linearGradient>
    <radialGradient id="bubble" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".24" stop-color="#dffffb" stop-opacity=".2"/>
      <stop offset=".72" stop-color="#b9fff4" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".34"/>
    </radialGradient>
    <linearGradient id="caustic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".36"/>
      <stop offset="1" stop-color="#e0fff4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1824" height="1024" fill="url(#water)"/>
  <rect width="1824" height="1024" fill="url(#centerGlow)"/>
