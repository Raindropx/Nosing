<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160"><desc>Frutiger Aero 风格软件背景壁纸，16:9 横向。整幅画面从边缘到边缘连续铺满：清澈青蓝海水，柔和的斜射阳光，零星小气泡，底部角落少量海草，中央是宁静低对比的蓝绿色渐变。无任何边框、描边、内框、矩形色块、界面、面板、按钮、文字、图标、标志或水印。整合细碎的细节为更干净的面。</desc>
  <title>Frutiger Aero underwater software wallpaper</title>
  <desc>Full-bleed tranquil cyan-blue ocean scene with soft diagonal sunlight, subtle bubbles and sparse sea grass, built entirely from editable vector shapes and gradients.</desc>
  <defs>
